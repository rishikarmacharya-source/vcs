<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup | EcoMart</title>

    <!-- External site-wide styles -->
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* ===== Login page layout ===== */
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Login heading */
        .login-container h2 {
            color: darkcyan;
            margin-bottom: 20px;
        }

        /* Login form inputs */
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: darkcyan;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #006666;
        }

        /* Switch to signup link */
        .switch-form {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .switch-form a {
            color: darkcyan;
            text-decoration: none;
            font-weight: bold;
        }

        .switch-form a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<!-- ===== Header section ===== -->
<header style="position: relative;">
    <div class="header-right">
        <a href="login.html">Login / Signup</a>
        <a href="cart.html" class="cart-box">🛒 Cart (0)</a>
    </div>

    <h1>EcoMart</h1>
    <p>Shop Green. Live Clean.</p>

    <!-- Navigation menu -->
    <nav>
        <a href="../index.html">Home</a>
        <a href="productpage.html">Shop</a>
        <a href="blog.html">Blog</a>
        <a href="aboutus.html">About us</a>
        <a href="contact.html">Contact us</a>
        <a href="research.html">Research</a>
    </nav>
</header>

<!-- ===== Login form section ===== -->
<div class="login-container">
    <h2>Welcome Back</h2>

    <form class="login-form">
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="switch-form">
        Don't have an account? <a href="signup.html">Sign Up here</a>
    </div>
</div>

<br>

<!-- ===== Footer ===== -->
<footer style="text-align: center; padding: 20px; margin-top: 40px;">
    <p>&copy; 2026 EcoMart | Sustainable Future</p>
</footer>

</body>
</html>
